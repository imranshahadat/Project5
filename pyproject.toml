[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "Project5"
version = "1.0.0"
description = "Production-grade RAG Chat API with async SQLAlchemy, Alembic, and secure auth"
readme = "README.md"
requires-python = ">=3.12,<3.13"  # Targets the stable Python 3.12.x series
license = {text = "Apache-2.0"}
authors = [
    {name = "Imran Ali", email = "imran@example.com"}
]

# Core backend dependencies
dependencies = [
    # Web Framework & Server
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.12",        # Required for FastAPI File() and Form()
    
    # Async Database & Migrations
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.30.0",                 # High-performance async PostgreSQL driver
    "alembic>=1.13.0",                 # Database schema migrations
    
    # Settings & Validation
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "python-dotenv>=1.0.0",
    
    # Authentication & Security
    "python-jose[cryptography]>=3.3.0", # JWT encoding/decoding
    "passlib[bcrypt]>=1.7.4",           # Password hashing
    
    # Rate Limiting
    "slowapi>=0.1.9",
    
    # Cloud & Storage
    "boto3>=1.35.0",                   # AWS S3 integration
    
    # Vector Store & AI/LLM
    "pinecone>=5.0.0",                 # Modern Pinecone SDK
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "langgraph>=0.2.0",
    
    # Document Processing
    "pypdf>=5.0.0",
    "python-docx>=1.1.0",
    
    # Utilities
    "httpx>=0.27.0",                   # Async HTTP client
    "jinja2>=3.1.0",                   # Template rendering (if serving basic UI)

    "arq>=0.26.0",           # Async task queue
    "redis>=5.0.0",          # Redis client for ARQ
]

# Optional dependencies for development and testing
[project.optional-dependencies]
dev = [
    "ruff>=0.6.0",                     # Blazing fast linter and formatter (replaces black/flake8)
    "mypy>=1.11.0",                    # Static type checking
    "types-python-jose>=3.3.0",
    "types-passlib>=1.7.0",
]
test = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",          # Required for testing async FastAPI endpoints
    "pytest-cov>=5.0.0",               # Test coverage reporting
    "httpx>=0.27.0",                   # For FastAPI TestClient
]

# --- Tool Configurations ---

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort (import sorting)
    "B",   # flake8-bugbear (catches common bugs)
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade (enforces modern Python 3.12 syntax)
]
ignore = [
    "E501", # Line length (handled by formatter)
    "B008", # Do not perform function calls in argument defaults (FastAPI Depends uses this)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["test"]
addopts = "--cov=src/app --cov-report=term-missing --strict-markers"